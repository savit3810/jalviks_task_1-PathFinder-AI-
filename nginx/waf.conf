# ─── Rate Limiting Zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ─── Upstream Backends ─────────────────────────────────────────────────────────
upstream frontend_upstream {
    server frontend:80;
}
upstream backend_upstream {
    server backend:8000;
}

# ─── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost;

    # ── TLS Configuration ──────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # ── Security Headers (WAF Layer) ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    # ── Hide Server Version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Request Size Limits ────────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── WAF: Block Common Attack Patterns ──────────────────────────────────────
    # Block SQL injection patterns
    set $block_sql_injections 0;
    if ($query_string ~* "union.*select|select.*from|insert.*into|delete.*from|drop.*table|update.*set") {
        set $block_sql_injections 1;
    }
    if ($query_string ~* "concat.*\(|char\(|benchmark\(|sleep\(|load_file\(") {
        set $block_sql_injections 1;
    }
    if ($block_sql_injections = 1) {
        return 403;
    }

    # Block XSS patterns
    set $block_xss 0;
    if ($query_string ~* "<script|javascript:|vbscript:|on\w+\s*=") {
        set $block_xss 1;
    }
    if ($request_uri ~* "<script|javascript:|vbscript:|on\w+\s*=") {
        set $block_xss 1;
    }
    if ($block_xss = 1) {
        return 403;
    }

    # Block common exploit scanners and path traversal
    if ($request_uri ~* "\.\.\/|\.\.\\\\|%2e%2e|%252e|etc\/passwd|proc\/self") {
        return 403;
    }

    # Block common vulnerable endpoints
    if ($request_uri ~* "(wp-admin|wp-login|phpmyadmin|\.env$|\.git|\.svn)") {
        return 403;
    }

    # ── API Proxy ──────────────────────────────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Frontend SPA ───────────────────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
