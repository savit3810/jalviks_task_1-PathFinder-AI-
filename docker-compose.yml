version: '3.8'

networks:
  edge:
    name: pathfinder_edge
  app:
    name: pathfinder_app
    internal: true
  db:
    name: pathfinder_db
    internal: true

services:
  waf:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: pathfinder_waf
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - app
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfinder_frontend
    networks:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /etc/nginx/conf.d

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pathfinder_backend
    ports:
      - "8000:8000"
    networks:
      - edge
      - app
      - db
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-secret}@mongo:27017/pathfinder?authSource=admin
      - APP_ENV=production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:6.0
    container_name: pathfinder_mongo
    networks:
      - db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secret}
      - MONGO_INITDB_DATABASE=pathfinder
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    mem_limit: 1024m

volumes:
  mongo_data:
