name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Nightly

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep ci --config=p/owasp-top-ten --config=p/python --config=p/typescript --config=p/react --config=p/jwt --config=p/secrets --severity ERROR --error
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/python
            p/typescript
            p/react
            p/jwt
            p/secrets

  sca:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt --desc on
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit
        run: npm audit --audit-level=high

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend Image
        run: docker build -t pathfinder-frontend:latest -f Dockerfile .
      - name: Build Backend Image
        run: docker build -t pathfinder-backend:latest -f api/Dockerfile api/
      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pathfinder-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pathfinder-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  dast:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start application
        run: |
          docker-compose up --build -d
          sleep 30
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:80'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
      - name: Tear down
        if: always()
        run: docker-compose down

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scanning, container-scan, dast]
    steps:
      - name: Gate Check
        run: echo "All security checks passed. Proceeding with deployment."
